services:
  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_DATABASE: celery_worker_test
      MYSQL_USER: worker_test
      MYSQL_PASSWORD: worker_test
      MYSQL_ROOT_PASSWORD: worker_test_root
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uworker_test", "-pworker_test"]
      interval: 2s
      timeout: 5s
      retries: 60
  rabbitmq:
    image: rabbitmq:4.1.3-management
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit loopback_users []"
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 60
  runner:
    profiles: [tests]
    build:
      context: ${PAGODA_WORKER_SOURCE_DIR:?launcher sets source directory}
      dockerfile: tools/celery_worker/Dockerfile
    working_dir: /workspace
    volumes:
      - ${PAGODA_WORKER_TEST_DIR:?launcher sets artifact directory}:/artifacts
    environment:
      DJANGO_SETTINGS_MODULE: tools.celery_worker.settings
      DJANGO_CONFIGURATION: WorkerTest
      PAGODA_WORKER_TEST: "1"
      PAGODA_WORKER_TEST_DIR: /artifacts
      PAGODA_WORKER_CONTROL_DIR: /artifacts/control
      PAGODA_LITE: "0"
      AIRONE_MYSQL_MASTER_URL: mysql://worker_test:worker_test@mysql:3306/celery_worker_test
      AIRONE_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      AIRONE_CELERY_EAGER: "0"
      DD_TRACE_ENABLED: "false"
      ENABLED_PLUGINS: ""
    command: [python, -m, unittest, -v, tools.celery_worker.test_worker]
